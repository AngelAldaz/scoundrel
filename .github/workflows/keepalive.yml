# Mantiene despierto el proyecto gratuito de Supabase (se pausa tras 7 días sin actividad)
# haciendo una consulta cada 3 días. Además reactiva este workflow para que GitHub
# no lo desactive tras 60 días sin commits en el repo.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY no configurados; nada que hacer."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/scores?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Intento $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: liskin/gh-workflow-keepalive@v1
